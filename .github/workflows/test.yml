name: Cloudflare API Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  test-workers:
    runs-on: ubuntu-latest
    name: Workers API Test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Fetch Sub-Store release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/fetch-substore.sh
          bash scripts/fetch-frontend.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm run install:backend

      - name: Test runtime and release selection
        run: |
          node --test scripts/test-release-selection.mjs scripts/test-substore-transform.mjs scripts/test-resource-cache.mjs scripts/test-share.mjs scripts/test-quickjs-engine.mjs scripts/test-substore-engine.mjs scripts/test-shoutrrr-notification.mjs scripts/test-single-store-routing.mjs scripts/test-single-store-storage.mjs

      - name: Configure wrangler.toml
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's|__SUB_STORE_FRONTEND_BACKEND_PATH__|/local-test-backend|g' wrangler.toml

      - name: Build Worker and official frontend
        run: pnpm run build:workers

      - name: Start dev server
        run: |
          pnpm run dev:workers > workers-dev.log 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        uses: iFaxity/wait-on-action@v1.2.1
        with:
          resource: http-get://127.0.0.1:3000/local-test-backend/api/utils/env
          timeout: 120000
          interval: 1000
          httpTimeout: 10000
          log: true

      - name: Print Workers dev log on failure
        if: failure()
        run: cat workers-dev.log || true

      - name: Run API tests
        run: |
          node scripts/test-single-store.mjs http://127.0.0.1:3000
          curl -fsS http://127.0.0.1:3000/ | cmp - public/frontend/index.html

      - name: Stop dev server
        if: always()
        run: kill "$DEV_PID" 2>/dev/null || true
