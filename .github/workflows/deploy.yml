name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '*.md'
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制部署（忽略版本检查）'
        required: false
        type: boolean
        default: false

env:
  SUBSTORE_REPO: sub-store-org/Sub-Store
  FRONTEND_REPO: sub-store-org/Sub-Store-Front-End

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy_backend }}
      backend_version: ${{ steps.check.outputs.backend_version }}
      frontend_version: ${{ steps.check.outputs.frontend_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore last release versions
        uses: actions/cache/restore@v5
        with:
          path: |
            .last-backend-version
            .last-frontend-version
          key: version-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            version-cache-${{ github.ref_name }}-
      - name: Check official releases
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/check-updates.js

  deploy:
    needs: check-updates
    if: contains(needs.check-updates.outputs.deploy, 'ACTION_START')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Download selected releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUBSTORE_VERSION: ${{ needs.check-updates.outputs.backend_version }}
          FRONTEND_VERSION: ${{ needs.check-updates.outputs.frontend_version }}
        run: |
          bash scripts/fetch-substore.sh
          bash scripts/fetch-frontend.sh
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm run install:backend
      - name: Configure Worker
        env:
          SUB_STORE_FRONTEND_BACKEND_PATH: ${{ secrets.SUB_STORE_FRONTEND_BACKEND_PATH }}
          MMDB_COUNTRY_URL: ${{ vars.MMDB_COUNTRY_URL || secrets.MMDB_COUNTRY_URL }}
          MMDB_ASN_URL: ${{ vars.MMDB_ASN_URL || secrets.MMDB_ASN_URL }}
          SUB_STORE_PUSH_SERVICE: ${{ secrets.SUB_STORE_PUSH_SERVICE }}
          WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os, pathlib, re
          config = pathlib.Path('wrangler.toml.example').read_text()
          backend_path = os.environ['SUB_STORE_FRONTEND_BACKEND_PATH'].strip()
          if not backend_path.startswith('/') or backend_path == '/' or any(c.isspace() or c in '?#' for c in backend_path):
              raise SystemExit('Invalid SUB_STORE_FRONTEND_BACKEND_PATH')
          placeholder = '"__SUB_STORE_FRONTEND_BACKEND_PATH__"'
          if config.count(placeholder) != 1:
              raise SystemExit('Missing or duplicate backend path placeholder')
          config = config.replace(placeholder, json.dumps(backend_path))
          keys = ('MMDB_COUNTRY_URL', 'MMDB_ASN_URL', 'SUB_STORE_PUSH_SERVICE')
          entries = ''.join(f'{key} = {json.dumps(os.environ.get(key, ""))}\n' for key in keys)
          config = config.replace('[vars]\n', '[vars]\n' + entries, 1)
          name = os.environ.get('WORKER_NAME', '').strip()
          if name:
              if not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,62}', name):
                  raise SystemExit('Invalid CF_WORKER_NAME')
              config = re.sub(r'^name\s*=.*$', 'name = ' + json.dumps(name), config, count=1, flags=re.M)
          pathlib.Path('wrangler.toml').write_text(config)
          PYCONFIG
      - name: Build Worker and official frontend
        run: pnpm run build:workers
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | sed -e '/workers[.]dev/d' -e '/https:/d'
          echo 'Deploy completed'

  update-version-cache:
    needs: [check-updates, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record deployed release versions
        env:
          BACKEND_VERSION: ${{ needs.check-updates.outputs.backend_version }}
          FRONTEND_VERSION: ${{ needs.check-updates.outputs.frontend_version }}
        run: |
          printf '%s' "$BACKEND_VERSION" > .last-backend-version
          printf '%s' "$FRONTEND_VERSION" > .last-frontend-version
      - name: Save release version cache
        uses: actions/cache/save@v5
        with:
          path: |
            .last-backend-version
            .last-frontend-version
          key: version-cache-${{ github.ref_name }}-${{ github.run_id }}
