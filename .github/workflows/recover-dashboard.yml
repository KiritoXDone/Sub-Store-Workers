name: Temporary Dashboard Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Recover existing administrator and verify login
        env:
          ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEW_PASSWORD: ${{ secrets.DASHBOARD_RECOVERY_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { createHmac, createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const base = 'https://oneui.050623.xyz';
          const password = process.env.NEW_PASSWORD;
          assert.ok(password && password.length >= 24, 'Missing recovery password');
          const cf = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.ACCOUNT_ID)}/workers/scripts/${encodeURIComponent(process.env.WORKER_NAME)}/settings`, {
            headers: { Authorization: `Bearer ${process.env.CF_API_TOKEN}` },
            signal: AbortSignal.timeout(15000), redirect: 'error',
          });
          if (!cf.ok) throw new Error(`Cannot inspect deployed settings: HTTP ${cf.status}`);
          const settings = await cf.json();
          const deployedKey = settings.result?.bindings?.find(binding => binding.name === 'JWT_SECRET');
          const key = deployedKey?.text || process.env.JWT_SECRET;
          assert.ok(key, 'Signing key unavailable');
          console.log(`::add-mask::${key}`);
          const now = Math.floor(Date.now() / 1000);
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const unsigned = `${encode({alg:'HS256'})}.${encode({id:0,username:'owner-recovery',role:'admin',iat:now,exp:now+120})}`;
          const maintenanceToken = `${unsigned}.${createHmac('sha256',key).update(unsigned).digest('base64url')}`;
          console.log(`::add-mask::${maintenanceToken}`);
          async function api(path, { body, token = maintenanceToken } = {}) {
            const response = await fetch(base + path, {
              method: body ? 'POST' : 'GET',
              headers: { ...(token ? {Authorization:`Bearer ${token}`} : {}), ...(body ? {'Content-Type':'application/json'} : {}) },
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(15000), redirect:'error',
            });
            if (!response.ok) throw new Error(`Recovery API ${path.replace(/\/\d+/g,'/:id')} returned HTTP ${response.status}`);
            return await response.json();
          }
          const users = await api('/api/dashboard/admin/users');
          assert.ok(Array.isArray(users), 'Unexpected user listing');
          const admins = users.filter(user => user.role === 'admin');
          if (admins.length !== 1) {
            console.log('Administrator names:', JSON.stringify(admins.map(user => user.username)));
            throw new Error('Recovery requires exactly one existing administrator; no changes made');
          }
          const admin = admins[0];
          assert.ok(Number.isSafeInteger(admin.id) && admin.id > 0);
          const publicSettings = await api('/api/dashboard/settings/public', {token:null});
          assert.equal(publicSettings.captchaType,'builtin','Interactive verification required; no changes made');
          const before = await api(`/api/dashboard/admin/user/${admin.id}`);
          const digest = value => createHash('sha256').update(JSON.stringify(value ?? null)).digest('hex');
          const beforeData = digest(before.data);
          await api(`/api/dashboard/admin/user/${admin.id}/password`, {body:{newPassword:password}});
          const after = await api(`/api/dashboard/admin/user/${admin.id}`);
          assert.equal(digest(after.data), beforeData, 'User data changed during recovery');
          assert.equal(after.username, before.username);
          assert.equal(after.path, before.path);
          assert.equal(after.token_version, before.token_version + 1);
          const captcha = await api('/api/dashboard/captcha', {token:null});
          const code = [...captcha.svg.matchAll(/<text[^>]*>([^<]+)<\/text>/g)].map(match => match[1]).join('');
          const login = await api('/api/dashboard/auth/login', {token:null,body:{username:admin.username,password,captchaId:captcha.id,captchaCode:code}});
          assert.equal(login.role,'admin');
          assert.ok(login.token);
          console.log(`::add-mask::${login.token}`);
          const me = await api('/api/dashboard/user/me', {token:login.token});
          assert.equal(me.id,admin.id);
          console.log('RECOVERY_RESULT ' + JSON.stringify({username:admin.username,loginVerified:true,dataPreserved:true}));
          JS
